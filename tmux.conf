# ─────────────────────────────────────────────────────────────
# SETTINGS
# ─────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix          # C-a C-a reaches a nested tmux / start-of-line

# TERM: inside tmux this must be a screen/tmux entry, not xterm.
# Truecolor is restored via the override below.
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

set -sg escape-time 0
set -g repeat-time 0
set -g history-limit 200000   # agent transcripts are long
set -g mode-keys vi
set -g mouse on
set -g focus-events on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ─────────────────────────────────────────────────────────────
# MULTI-AGENT AWARENESS
# The problem with N agents is knowing which one wants you.
# A working agent emits output constantly; a finished or
# blocked one goes quiet. So silence == "needs me".
# ─────────────────────────────────────────────────────────────
setw -g monitor-silence 20    # flag a window after 20s of no output
setw -g monitor-activity on
setw -g monitor-bell on
set -g visual-silence on
set -g visual-activity off
set -g visual-bell off
set -g bell-action any

# Label every pane so a 4-way split is readable at a glance.
setw -g pane-border-status top
setw -g pane-border-format " #P #{pane_current_command} #{?pane_active,◀,} "
set -g pane-border-style        "fg=#434c5e"
set -g pane-active-border-style "fg=#81a1c1"

# Window tabs: index, dir basename, and a marker when the window
# has gone silent (✱) or is zoomed (Z).
setw -g window-status-format         " #I:#{b:pane_current_path}#{?window_silence_flag, ✱,}#{?window_activity_flag, ●,} "
setw -g window-status-current-format "[#I:#{b:pane_current_path}#{?window_zoomed_flag, Z,}]"

# Nord. The bar itself is polar-night, so the blue tabs are the only
# saturated thing on the row and the eye goes straight to them.
set -g status-position top
set -g status-style "fg=#d8dee9,bg=#3b4252"

# Inverted video means "you are here" and nothing else. Alerts speak
# through the ✱ / ● markers plus hue -- if a background window could
# also go dark, the bar would point at the wrong tab.
setw -g window-status-style          "fg=#2e3440,bg=#81a1c1"
setw -g window-status-current-style  "fg=#88c0d0,bg=#2e3440,bold"
setw -g window-status-activity-style "fg=#2e3440,bg=#ebcb8b,bold"
setw -g window-status-bell-style     "fg=#eceff4,bg=#bf616a,bold"

set -g message-style "fg=#eceff4,bg=#5e81ac,bold"
set -g mode-style    "fg=#2e3440,bg=#88c0d0"

# status-left is empty because #S already rides on the right.
set -g status-interval 5
set -g status-left ""
set -g status-left-length 30
set -g status-right-length 40
set -g status-right "#[fg=#ebcb8b,bold]#{?client_prefix,^A ,}#[fg=#81a1c1]#S #[fg=#4c566a]│#[fg=#d8dee9] %H:%M "

# ─────────────────────────────────────────────────────────────
# BINDINGS
# ─────────────────────────────────────────────────────────────
bind-key v split-window -h -c '#{pane_current_path}'
bind-key s split-window -v -c '#{pane_current_path}'
bind-key c new-window -c '#{pane_current_path}'

bind-key b break-pane -d      # promote pane to its own window, stay put
bind-key t choose-tree -Zw    # the agent switchboard (zoomed, windows)
bind-key x confirm-before -p "kill pane #P (#{pane_current_command})? (y/n)" kill-pane
bind-key X confirm-before -p "kill window #W (#{window_panes} panes)? (y/n)" kill-window

# Fan a prompt out to every pane in the window
bind-key S setw synchronize-panes \; display "sync #{?pane_synchronized,ON,OFF}"

# Dump this agent's full scrollback to a file and tell me where
bind-key P run-shell 'f=~/tmux-#{session_name}-#{window_index}.#{pane_index}.log; tmux capture-pane -pJS - -t #{pane_id} > $f; tmux display "saved $f"'

# Scratch shell over the top, same cwd, without disturbing layout
bind-key g display-popup -E -d '#{pane_current_path}' -w 85% -h 85%

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l"  "select-pane -R"
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

bind r source-file ~/.tmux.conf \; display "Config reloaded! :)"

# resize panes (steps of 10 cols / 2 rows)
bind -n C-Left  resize-pane -L 10
bind -n C-Right resize-pane -R 10
bind -n C-Down  resize-pane -D 2
bind -n C-Up    resize-pane -U 2

# ─────────────────────────────────────────────────────────────
# COPY MODE (vi)
# ─────────────────────────────────────────────────────────────
setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle
